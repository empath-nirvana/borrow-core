name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Mathlib comes from `lake exe cache get`; only this project's build output is cached.
      - name: Cache project build
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Fetch Mathlib cache
        run: lake exe cache get || true

      - name: Build
        run: lake build

      - name: Hygiene and axioms
        run: scripts/check-hygiene.sh

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Corpus — parse, check, compile
        run: |
          scripts/parse-corpus.sh
          scripts/check-corpus.sh
          scripts/compile-corpus.sh
