name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Mathlib comes from `lake exe cache get`; only this project's build output is cached.
      - name: Cache project build
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Fetch Mathlib cache
        run: lake exe cache get || true

      - name: Build
        run: lake build

      - name: Hygiene and axioms
        run: scripts/check-hygiene.sh

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Corpus — parse, check, compile
        run: |
          scripts/parse-corpus.sh
          scripts/check-corpus.sh
          scripts/compile-corpus.sh

      - name: Book doc-tests
        run: scripts/book-doctest.sh

  # The book builds without Lean; its programs are doc-tested in the build job, against bcc.
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.40'

      - name: Build the book
        run: |
          mdbook build book
          # A failed include is only a warning in mdBook; fail on one here.
          if grep -rl '{{#include' book/book --include='*.html'; then
            echo "unexpanded {{#include}} in the built book"; exit 1
          fi

      - name: Upload the book
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: book/book
