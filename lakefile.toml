name = "borrow_core"
defaultTargets = ["Paper", "Support", "Examples", "Core", "Frontend", "Backend", "Backend2", "bcc", "bcc-counts"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "Support"

[[lean_lib]]
name = "Paper"

[[lean_lib]]
name = "Examples"

[[lean_lib]]
name = "Core"

[[lean_lib]]
name = "Frontend"

[[lean_lib]]
name = "Backend"

# The new backend (docs/compiler.md, N1): compiles the typed term.
[[lean_lib]]
name = "Backend2"

[[lean_exe]]
name = "bcc"
root = "Frontend.Main"

[[lean_exe]]
name = "bcc-counts"
root = "Backend.Counts"

# Not a default target: the census of kernel nodes in the corpus (`docs/kernel-usage.md`).
[[lean_exe]]
name = "kernel-census"
srcDir = "scripts"
root = "KernelCensus"

# Experiments: not default targets; the library never imports them.

[[lean_lib]]
name = "CBPVCore"
srcDir = "experiments/CBPVCore"
roots = ["CBPVCore"]

[[lean_lib]]
name = "CBPVWorld"
srcDir = "experiments/CBPVWorld"
roots = ["CBPVWorld"]

[[lean_lib]]
name = "Experiments"
srcDir = "experiments"
roots = ["CBPVSplit.Split", "ModesLabels.Modes", "Shifts.Shifts", "BorrowedClosures.Reborrow",
  "BorrowedClosures.EnvCheck"]

