name = "borrow_core"
defaultTargets = ["Paper", "Support", "Examples"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "Support"

[[lean_lib]]
name = "Paper"

[[lean_lib]]
name = "Examples"

# Experiments: not default targets; the library never imports them.

[[lean_lib]]
name = "CBPVCore"
srcDir = "experiments/CBPVCore"
roots = ["CBPVCore"]

[[lean_lib]]
name = "CBPVWorld"
srcDir = "experiments/CBPVWorld"
roots = ["CBPVWorld"]

[[lean_lib]]
name = "Experiments"
srcDir = "experiments"
roots = ["CBPVSplit.Split", "ModesLabels.Modes", "Shifts.Shifts", "BorrowedClosures.Reborrow",
  "BorrowedClosures.EnvCheck"]
