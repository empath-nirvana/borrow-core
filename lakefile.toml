name = "borrow_core"
defaultTargets = ["Paper", "Support", "Examples", "Core", "Frontend", "Backend", "bcc"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "Support"

[[lean_lib]]
name = "Paper"

[[lean_lib]]
name = "Examples"

[[lean_lib]]
name = "Core"

[[lean_lib]]
name = "Frontend"

[[lean_lib]]
name = "Backend"

[[lean_exe]]
name = "bcc"
root = "Frontend.Main"

# Experiments: not default targets; the library never imports them.

[[lean_lib]]
name = "CBPVCore"
srcDir = "experiments/CBPVCore"
roots = ["CBPVCore"]

[[lean_lib]]
name = "CBPVWorld"
srcDir = "experiments/CBPVWorld"
roots = ["CBPVWorld"]

[[lean_lib]]
name = "Experiments"
srcDir = "experiments"
roots = ["CBPVSplit.Split", "ModesLabels.Modes", "Shifts.Shifts", "BorrowedClosures.Reborrow",
  "BorrowedClosures.EnvCheck"]

[[lean_lib]]
name = "Projection"
srcDir = "experiments/Projection"
roots = ["Projection"]

[[lean_lib]]
name = "Relaxed"
srcDir = "experiments/Relaxed"
roots = ["Relaxed"]

[[lean_lib]]
name = "Records"
srcDir = "experiments/Records"
roots = ["Records"]

[[lean_lib]]
name = "FrameEnd"
srcDir = "experiments/FrameEnd"
roots = ["FrameEnd"]

[[lean_lib]]
name = "Places"
srcDir = "experiments/Places"
roots = ["Places"]

[[lean_lib]]
name = "LeafPlaces"
srcDir = "experiments/LeafPlaces"
roots = ["LeafPlaces"]

[[lean_lib]]
name = "Recursion"
srcDir = "experiments/Recursion"
roots = ["Recursion"]

[[lean_lib]]
name = "CBPVMu"
srcDir = "experiments/CBPVMu"
roots = ["CBPVMu"]

[[lean_lib]]
name = "Optics"
srcDir = "experiments/Optics"
roots = ["Optics"]

[[lean_lib]]
name = "FrameTheorems"
srcDir = "experiments/FrameTheorems"
roots = ["FrameTheorems"]

[[lean_lib]]
name = "TwoRun"
srcDir = "experiments/TwoRun"
roots = ["TwoRun"]
