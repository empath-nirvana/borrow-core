# The Rust baseline of #977: serde_json's `from_slice::<Value>` (mode `parse`) and
# `from_slice` + `to_vec` (mode `roundtrip`). Two builds: the primary baseline with the feature
# `exact` (serde_json's `float_roundtrip`, floats read correctly rounded, as `lib/json.bc` reads
# them), `cargo build --release --offline --locked --features exact --target-dir target-exact`;
# and a reference with serde_json's default features (a faster float reader, not correctly
# rounded), `cargo build --release --offline --locked`. Versions are pinned by `Cargo.lock`.
[package]
name = "json-bench"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "json-bench"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.151"

[features]
exact = ["serde_json/float_roundtrip"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
